[package]
name = "gpulock_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
  "ring",
  "remote_pairing",
  "rsd",
  "tunnel_tcp_stack",
  "condition_inducer",
  "cryptexd",
] }
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
